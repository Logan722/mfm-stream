<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monitors</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a101c; font-family: "Inter Tight", system-ui, sans-serif; }
  .wrap { display: flex; height: 100%; gap: 128px; background: #0a101c; padding: 0 6px; }
  .wrap.has-vert { gap: 90px; }
  .pane.vt { flex: 0 0 20%; display: none; }
  .wrap.has-vert .pane.vt { display: block; }
  .tag.vt-tag { background: #8899b8; color: #0f1a30; }
  .pane { flex: 1; position: relative; background: #0a101c; overflow: hidden; }
  .pane video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .pane video.crop { inset: auto; width: auto; height: auto; max-width: none; }
  .tag { position: absolute; top: 10px; left: 10px; z-index: 2; font-size: 11px; font-weight: 800; letter-spacing: .14em; padding: 4px 10px; border-radius: 4px; }
  .tag.pv { background: #d4a853; color: #0f1a30; }
  .tag.pg { background: #d63b3b; color: #fff2ee; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6a7a96; font-size: 13px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pane">
    <span class="tag pv">PREVIEW</span>
    <video id="pv" autoplay playsinline muted></video>
    <div class="empty" id="pv-empty">Waiting for the engine&rsquo;s preview&hellip; (the VPS must run the latest code)</div>
  </div>
  <div class="pane">
    <span class="tag pg">PROGRAM</span>
    <video id="pg" autoplay playsinline muted></video>
    <div class="empty" id="pg-empty">Waiting for the program feed&hellip;</div>
  </div>
  <div class="pane vt">
    <span class="tag vt-tag">9:16</span>
    <video id="vt" autoplay playsinline muted></video>
    <div class="empty" id="vt-empty">Waiting for the portrait feed&hellip; (runner needs VERTICAL=1)</div>
  </div>
</div>
<script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
(function () {
  "use strict";
  var ENGINE_UID = "mfm-program-engine";
  var call = null;

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.t !== "mfm-monitor-join" || call) return;
    var Daily = window.Daily || window.DailyIframe;
    if (!Daily || !Daily.createCallObject) return;
    if (d.vertical) document.querySelector(".wrap").classList.add("has-vert");
    call = Daily.createCallObject({
      subscribeToTracksAutomatically: false, // ONLY the engine's tracks
      videoSource: false,
      audioSource: false,
    });
    call
      .on("participant-joined", sync)
      .on("participant-updated", sync)
      .on("track-started", attach);
    call.join({ url: d.url, token: d.token }).then(function () {
      if (d.engineSid) {
        try {
          call.updateParticipant(d.engineSid, {
            setSubscribedTracks: { video: true, screenVideo: true, audio: false },
          });
          vtSay("subscribed by id");
        } catch (err) {
          vtSay("sub-by-id error: " + ((err && err.message) || err));
        }
      }
    }).catch(function () { /* parent shows state */ });
  });

  function isEngine(p) {
    return !!p && !p.local && (p.user_id === ENGINE_UID || p.user_name === "PROGRAM");
  }

  var vtLog = [];
  function vtSay(msg) {
    var ve = document.getElementById("vt-empty");
    vtLog.push(msg);
    if (vtLog.length > 4) vtLog.shift();
    if (ve) ve.textContent = vtLog.join(" · ");
  }

  function sync(e) {
    var p = e.participant;
    if (!isEngine(p) || !call) return;
    try {
      call.updateParticipant(p.session_id, {
        setSubscribedTracks: { video: true, screenVideo: true, custom: true, audio: false },
      });
      vtSay("subscribed");
    } catch (err) {
      vtSay("subscribe error: " + ((err && err.message) || err));
    }
    // Also report which of the engine's tracks exist from our side
    try {
      var names = Object.keys(p.tracks || {}).filter(function (k) {
        return p.tracks[k] && p.tracks[k].state && p.tracks[k].state !== "off";
      });
      vtSay("engine tracks: " + (names.join(",") || "none"));
    } catch (e2) { /* fine */ }
  }

  function attach(e) {
    var p = e.participant;
    if (!isEngine(p) || !e.track || e.track.kind !== "video") return;
    function matches(tr) {
      return !!(tr && (tr.track && tr.track.id === e.track.id ||
                       tr.persistentTrack && tr.persistentTrack.id === e.track.id));
    }
    var which = "pg"; // camera = program
    if (e.type === "screenVideo" || matches(p.tracks && p.tracks.screenVideo)) which = "pv";
    else if (e.type === "video" || matches(p.tracks && p.tracks.video)) which = "pg";
    else which = "vt"; // anything else = the portrait custom track
    var v = document.getElementById(which);
    var empty = document.getElementById(which + "-empty");
    v.srcObject = new MediaStream([e.track]);
    v.play().catch(function () { /* muted autoplay is allowed */ });
    if (empty) empty.style.display = "none";
    if (which !== "vt") vtSay("got " + which + " track");
    if (which === "pv") {
      v.onloadedmetadata = function () {
        if (v.videoWidth > 2000) setupComposite(v);
      };
      if (v.videoWidth > 2000) setupComposite(v);
    }
  }

  /* The preview feed carries [preview 1920x1080 | portrait 608x1080].
     Show each region in its own pane by oversizing + offsetting the videos. */
  var compositeOn = false;

  function setupComposite(pv) {
    if (compositeOn) { layoutCrops(); return; }
    compositeOn = true;
    var vt = document.getElementById("vt");
    vt.srcObject = pv.srcObject; // same stream, second view
    vt.play().catch(function () {});
    var ve = document.getElementById("vt-empty");
    if (ve) ve.style.display = "none";
    pv.classList.add("crop");
    vt.classList.add("crop");
    layoutCrops();
    window.addEventListener("resize", layoutCrops);
    setInterval(layoutCrops, 2000); // panes can change size with the window
  }

  function layoutCrops() {
    if (!compositeOn) return;
    var pv = document.getElementById("pv");
    var vt = document.getElementById("vt");
    var pvPane = pv.parentElement, vtPane = vt.parentElement;
    var VW = 2528, VH = 1080;
    // Preview pane shows [0,0,1920x1080]
    var s1 = Math.min(pvPane.clientWidth / 1920, pvPane.clientHeight / 1080);
    pv.style.width = (VW * s1) + "px";
    pv.style.height = (VH * s1) + "px";
    pv.style.left = ((pvPane.clientWidth - 1920 * s1) / 2) + "px";
    pv.style.top = ((pvPane.clientHeight - 1080 * s1) / 2) + "px";
    // 9:16 pane shows [1920,0,608x1080]
    var s2 = Math.min(vtPane.clientWidth / 608, vtPane.clientHeight / 1080);
    vt.style.width = (VW * s2) + "px";
    vt.style.height = (VH * s2) + "px";
    vt.style.left = (((vtPane.clientWidth - 608 * s2) / 2) - 1920 * s2) + "px";
    vt.style.top = ((vtPane.clientHeight - 1080 * s2) / 2) + "px";
  }
})();
</script>
</body>
</html>
