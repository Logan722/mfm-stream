<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monitors</title>
<style>
  /* Royal Flame monitor bezels (Option B "Monitors First" — Dawn, July 31).
     KEEP .wrap's gap + horizontal padding in sync with positionMonControls()
     in console.js — TAKE/CUT float in the gap between the panes. */
  html, body { margin: 0; height: 100%; background: #0a101c; font-family: "Inter Tight", system-ui, sans-serif; }
  .wrap { display: flex; height: 100%; gap: 128px; background: #0a101c; padding: 10px 6px; box-sizing: border-box; }
  .wrap.has-vert { gap: 90px; }
  .pane {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: #0d1626; border: 1px solid rgba(201, 149, 44, 0.16);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
  }
  .pane.vt { flex: 0 0 20%; display: none; }
  .wrap.has-vert .pane.vt { display: flex; }
  .phead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 12px; flex-shrink: 0;
    font-size: 11px; font-weight: 800; letter-spacing: 0.16em;
  }
  .phead.pv-h { color: #d4a853; background: linear-gradient(180deg, rgba(201, 149, 44, 0.16), rgba(201, 149, 44, 0.04)); }
  .phead.pg-h { color: #ff7a3d; background: linear-gradient(180deg, rgba(232, 93, 38, 0.18), rgba(232, 93, 38, 0.05)); }
  .phead.vt-h { color: #8899b8; background: rgba(136, 153, 184, 0.08); }
  .phead small { color: #6a7a96; font-weight: 600; letter-spacing: 0.04em; }
  .phead .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff7a3d; box-shadow: 0 0 9px #ff7a3d; display: inline-block; margin-right: 7px; }
  .pview { position: relative; flex: 1; min-height: 0; }
  .pview video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .pview video.crop { display: none; }
  .mon-c { position: absolute; inset: 0; width: 100%; height: 100%; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6a7a96; font-size: 13px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pane">
    <div class="phead pv-h"><span>PREVIEW</span><small>staged &mdash; TAKE sends it to air</small></div>
    <div class="pview">
      <video id="pv" autoplay playsinline muted></video>
      <canvas class="mon-c" id="pv-c" hidden></canvas>
      <div class="empty" id="pv-empty">Waiting for the engine&rsquo;s preview&hellip; (the VPS must run the latest code)</div>
    </div>
  </div>
  <div class="pane">
    <div class="phead pg-h"><span><span class="dot"></span>PROGRAM &middot; LIVE</span><small>on air &mdash; what viewers see</small></div>
    <div class="pview">
      <video id="pg" autoplay playsinline muted></video>
      <div class="empty" id="pg-empty">Waiting for the program feed&hellip;</div>
    </div>
  </div>
  <div class="pane vt">
    <div class="phead vt-h"><span>9:16</span><small>portrait</small></div>
    <div class="pview">
      <video id="vt" autoplay playsinline muted></video>
      <canvas class="mon-c" id="vt-c" hidden></canvas>
      <div class="empty" id="vt-empty">Waiting for the portrait feed&hellip; (runner needs VERTICAL=1)</div>
    </div>
  </div>
</div>
<script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
(function () {
  "use strict";
  var ENGINE_UID = "mfm-program-engine";
  var call = null;
  var got = { pv: false, pg: false, vt: false }; // which panes have a live track
  var tries = 0;
  var joined = false;

  function say(pane, msg) {
    var el = document.getElementById(pane + "-empty");
    if (el) el.textContent = msg;
  }

  function sayWaiting(extra) {
    var suffix = extra ? " — " + extra : (tries > 1 ? " (attempt " + tries + ")" : "");
    if (!got.pg) say("pg", "Waiting for the program feed…" + suffix);
    if (!got.pv) say("pv", "Waiting for the engine’s PREVIEW share…" + suffix);
    if (!got.vt) say("vt", "Waiting for the portrait feed… (runner needs VERTICAL=1)");
  }

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.t !== "mfm-monitor-join" || call) return;
    var Daily = window.Daily || window.DailyIframe;
    if (!Daily || !Daily.createCallObject) { sayWaiting("video library failed to load — refresh the console"); return; }
    if (d.vertical) document.querySelector(".wrap").classList.add("has-vert");
    call = Daily.createCallObject({
      subscribeToTracksAutomatically: false, // ONLY the engine's tracks
      videoSource: false,
      audioSource: false,
    });
    // Any hint the room changed → try to (re)subscribe to the engine.
    call
      .on("participant-joined", subscribeEngine)
      .on("participant-updated", subscribeEngine)
      .on("track-started", attach);
    call.join({ url: d.url, token: d.token }).then(function () {
      joined = true;
      subscribeEngine();
      // The engine may already be in the room, may restart mid-service, or
      // its session id may have changed since the console last heard it —
      // keep retrying until the feeds actually attach (July 31: the old
      // one-shot subscribe left the monitors black forever).
      setInterval(function () {
        var needVt = document.querySelector(".wrap").classList.contains("has-vert");
        if (got.pg && got.pv && (!needVt || got.vt)) return;
        subscribeEngine();
      }, 4000);
    }).catch(function () {
      sayWaiting("the monitor could not join the room — refresh the console");
    });
  });

  function isEngine(p) {
    return !!p && !p.local && (p.user_id === ENGINE_UID || p.user_name === "PROGRAM");
  }

  /* Find the engine among CURRENT participants and subscribe to its tracks. */
  function subscribeEngine() {
    if (!call || !joined) return;
    var eng = null;
    try {
      var ps = call.participants() || {};
      Object.keys(ps).forEach(function (k) { if (isEngine(ps[k])) eng = ps[k]; });
    } catch (e) { /* fine — retry later */ }
    tries++;
    if (!eng) {
      sayWaiting("the engine isn’t in the room (check the Engine tab / droplet)");
      return;
    }
    try {
      call.updateParticipant(eng.session_id, {
        setSubscribedTracks: { video: true, screenVideo: true, custom: true, audio: false },
      });
    } catch (err) {
      // Some daily-js builds reject `custom` when no custom track exists yet.
      try {
        call.updateParticipant(eng.session_id, {
          setSubscribedTracks: { video: true, screenVideo: true, audio: false },
        });
      } catch (err2) { /* retry on the timer */ }
    }
    sayWaiting();
  }

  function attach(e) {
    var p = e.participant;
    if (!isEngine(p) || !e.track || e.track.kind !== "video") return;
    function matches(tr) {
      return !!(tr && (tr.track && tr.track.id === e.track.id ||
                       tr.persistentTrack && tr.persistentTrack.id === e.track.id));
    }
    var which = "pg"; // camera = program
    if (e.type === "screenVideo" || matches(p.tracks && p.tracks.screenVideo)) which = "pv";
    else if (e.type === "video" || matches(p.tracks && p.tracks.video)) which = "pg";
    else which = "vt"; // anything else = the portrait custom track
    var v = document.getElementById(which);
    var empty = document.getElementById(which + "-empty");
    v.srcObject = new MediaStream([e.track]);
    v.play().catch(function () { /* muted autoplay is allowed */ });
    if (empty) empty.style.display = "none";
    got[which] = true;
    if (which === "pv") {
      v.onloadedmetadata = function () {
        if (v.videoWidth > 2000) setupComposite(v);
      };
      if (v.videoWidth > 2000) setupComposite(v);
    }
  }

  /* The preview feed carries [preview 1920x1080 | portrait 608x1080].
     Show each region in its own pane by oversizing + offsetting the videos. */
  var compositeOn = false;

  function setupComposite(pv) {
    if (compositeOn) return;
    compositeOn = true;
    got.vt = true; // the portrait pane rides the composite preview feed
    var ve = document.getElementById("vt-empty");
    if (ve) ve.style.display = "none";
    pv.classList.add("crop"); // hide the raw video; canvases take over
    document.getElementById("pv-c").hidden = false;
    document.getElementById("vt-c").hidden = false;
    setInterval(function () { paintRegion(pv, "pv-c", 0, 1920); paintRegion(pv, "vt-c", 1920, 608); }, 66);
  }

  /* Draw an exact [sx, 0, sw, 1080] region of the composite feed into a pane
     canvas, letterboxed — pixel precise at any pane size. */
  function paintRegion(video, canvasId, sx, sw) {
    var c = document.getElementById(canvasId);
    var pane = c.parentElement;
    var cw = pane.clientWidth, ch = pane.clientHeight;
    if (!cw || !ch || video.readyState < 2) return;
    if (c.width !== cw) c.width = cw;
    if (c.height !== ch) c.height = ch;
    var g = c.getContext("2d");
    g.fillStyle = "#0a101c";
    g.fillRect(0, 0, cw, ch);
    var sc = Math.min(cw / sw, ch / 1080);
    var dw = sw * sc, dh = 1080 * sc;
    g.drawImage(video, sx, 0, sw, 1080, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
  }
})();
</script>
</body>
</html>
